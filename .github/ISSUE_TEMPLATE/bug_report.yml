name: Bug report
description: Report a reproducible problem
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "Remove private manuscripts, databases, paths and credentials. For security issues read SECURITY.md."
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Novel Weaver, OS, Python and Codex versions
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimal sanitized input and commands
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
