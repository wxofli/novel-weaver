[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "novel-weaver"
version = "0.1.0"
description = "Book-isolated, evidence-backed memory and tools for Codex fiction writing"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "wxofli"}]
requires-python = ">=3.11"
dependencies = ["pydantic==2.12.3", "mcp==2.3.0", "jieba==0.42.1", "httpx==0.28.1", "setuptools==84.2.1"]

[project.optional-dependencies]
vector = ["sqlite-vec==0.1.6"]
dev = ["pytest>=9,<10", "pytest-asyncio>=1,<2"]

[project.urls]
Homepage = "https://github.com/wxofli/novel-weaver"
Repository = "https://github.com/wxofli/novel-weaver"
Issues = "https://github.com/wxofli/novel-weaver/issues"
Changelog = "https://github.com/wxofli/novel-weaver/blob/main/CHANGELOG.md"


[project.scripts]
novelctl = "novel_weaver.cli:main"

[tool.hatch.build]
exclude = ["**/__pycache__/**", "**/*.pyc", "**/.env*", "**/.novel/**", "**/*.sqlite*", "**/*.db", "**/*.key", "**/*.pem", "**/*credentials*", "**/*secrets*", "**/.cache/**", "**/.venv/**", "**/books/**", "**/作品/**"]

[tool.hatch.build.targets.wheel]
packages = ["src/novel_weaver"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/scripts", "/skills", "/hooks", "/docs", "/examples", "/tests", "/.agents/plugins/marketplace.json", "/plugin.json", "/mcp.json", "/pyproject.toml", "/uv.lock", "/.python-version", "/README*", "/LICENSE", "/CHANGELOG.md", "/CONTRIBUTING.md", "/SECURITY.md", "/CODE_OF_CONDUCT.md", "/THIRD_PARTY_NOTICES.md"]
exclude = ["**/__pycache__/**", "**/*.pyc", "**/.env*", "**/.novel/**", "**/*.sqlite*", "**/*.db", "**/*.key", "**/*.pem", "**/*credentials*", "**/*secrets*", "**/.cache/**", "**/.venv/**", "**/books/**", "**/作品/**"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_default_fixture_loop_scope = "function"
